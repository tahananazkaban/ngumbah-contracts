name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed for the breaking-change check
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.74.0
          setup_only: true

      - name: Run all gates
        run: make check
